plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "xyz.cirno.pseudodcdimming"
        minSdk 31
        targetSdk 33
        versionCode 7
        versionName "1.3"
        resValue "string", "app_version_name", versionName
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'xyz.cirno.pseudodcdimming'
}

dependencies {
    compileOnly project(path: ':hidden-api')
    compileOnly project(path: ':xposed-api')
}
